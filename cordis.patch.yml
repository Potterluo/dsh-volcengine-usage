# dsh-volcengine-usage bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package: when installed
# through the DSH plugin CLI, the command reconciles `dsh.profile.bundles`
# against installed packages and, seeing this declaration, appends
# `dsh-volcengine-usage` to the bundle stack.
#
# The same row is also the `dsh.client` browser-roster entry the web modules
# half scans for the client bundle (exports["./client"] -> lib/client.js).
- insert:
    - id: volcengine-usage
      name: 'dsh-volcengine-usage'